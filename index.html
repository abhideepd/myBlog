<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhideep — Engineering & Notes</title>
    <meta name="description" content="A minimalist static blog documenting software engineering, system design, AI research, and code notes.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Code Highlight CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- KaTeX Math CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

    <!-- Reading Progress Bar -->
    <div id="reading-progress"></div>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-inner">
            <a href="#/" class="site-brand">
                <span class="brand-dot"></span>
                <span>abhideepd/myBlog</span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">
                    <span id="theme-icon">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </span>
                    <span id="theme-label">Dark</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="main-container">

        <!-- Feed / Post List View -->
        <section id="post-list-section" class="fade-in">
            <div class="hero-section">
                <h1 class="site-title">Engineering & Notes</h1>
                <p class="site-description">Thinking out loud on system design, compilers, AI research, and software patterns.</p>
                
                <div class="search-box">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Search posts by keyword or topic..." autocomplete="off">
                </div>

                <div id="tags-bar" class="tags-bar">
                    <!-- Dynamically populated tags -->
                </div>
            </div>

            <div id="loading-indicator" class="no-results hidden">
                <p class="font-medium">Loading posts...</p>
            </div>

            <div id="post-list-container" class="post-list">
                <!-- Dynamically rendered post items -->
            </div>
        </section>

        <!-- Article Reader View -->
        <section id="article-section" class="hidden">
            <div id="article-container">
                <!-- Dynamically rendered article content -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="header-inner" style="padding: 0; justify-content: center;">
            <p>© <span id="year">2026</span> Abhideep. Built with a zero-backend static blog engine.</p>
        </div>
    </footer>

    <!-- Vendor Libraries (Marked, Highlight.js, KaTeX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Application Script -->
    <script src="js/app.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
